<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Sisterlocks - Invoice Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #2d1b4e;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 14px;
        }
        
        .form-container {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #764ba2;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .row {
            display: flex;
            gap: 15px;
        }
        
        .row .form-group {
            flex: 1;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .service-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 15px 30px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💇🏾‍♀️ Joy Sisterlocks</h1>
            <p>Professional Sisterlocks & Microlocs Services</p>
            <p style="font-size: 12px; margin-top: 10px;">📍 Nairobi, Kenya</p>
        </div>
        
        <div class="form-container">
            <form method="POST">
                <div class="row">
                    <div class="form-group">
                        <label>Client Name *</label>
                        <input type="text" name="client_name" required placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" name="client_phone" required placeholder="0712 345 678">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email (optional)</label>
                    <input type="email" name="client_email" placeholder="client@example.com">
                </div>
                
                <div class="form-group">
                    <label>Service *</label>
                    <select name="service" required>
                        <option value="">Select a service</option>
                        {% for key, service in services.items() %}
                        <option value="{{ key }}">{{ service.name }} - KES {{ "{:,}".format(service.price) }}</option>
                        {% endfor %}
                    </select>
                    <div class="service-info">Prices include VAT | Retie services are recommended every 4-6 weeks</div>
                </div>
                
                <div class="form-group">
                    <label>Service Details (optional)</label>
                    <textarea name="service_details" placeholder="e.g., Waist length, color: brown, 250 strands"></textarea>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Appointment Date</label>
                        <input type="date" name="appointment_date">
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select name="payment_method">
                            <option value="Cash">Cash</option>
                            <option value="M-Pesa">M-Pesa</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Amount Paid (KES)</label>
                        <input type="number" name="amount_paid" value="0" placeholder="0">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Additional Notes</label>
                    <textarea name="notes" placeholder="Next appointment, aftercare instructions, etc."></textarea>
                </div>
                
                <button type="submit">📄 Generate Invoice PDF</button>
            </form>
        </div>
        
        <div class="footer">
            <p>Joy Sisterlocks | Nairobi, Kenya | WhatsApp: [Your Number]</p>
        </div>
    </div>
</body>
</html>
